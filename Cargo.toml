[package]
name = "txt-merge"
version = "0.1.0"
edition = "2026"
license = "GPL-3.0-or-later"
authors = ["SrLink16 <iio16@hotmail.com>"]

[[bin]]
name = "TXT-Merge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
encoding_rs = "0.8"
regex = "1"
rfd = "0.15"
similar = "2"
sys-locale = "0.3"
walkdir = "2"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
